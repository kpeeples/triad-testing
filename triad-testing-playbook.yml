---
- name: Verify Apache and dump welcome variable on RHEL 7
  hosts: foreman_rhel_web_server
  become: yes
  vars:
    # Default value if GitHub group_vars doesn't provide one
    # welcome_msg: "Default playbook welcome message"

  tasks:
    - name: Verify Apache (httpd) is installed
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Dump the welcome_msg variable to the AAP job log
      ansible.builtin.debug:
        msg: "The variable is: {{ welcome_message | default('Fallback message here') }}"

    - name: Ensure Apache is running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    - name: Reveal the true group names
      ansible.builtin.debug:
        msg: "Ansible sees this host in these groups: {{ group_names }}"

    - name: Get list of collections
      ansible.builtin.command: ansible-galaxy collection list
      register: galaxy_list
      changed_when: false

    - name: Print loaded collections
      ansible.builtin.debug:
        var: galaxy_list.stdout_lines