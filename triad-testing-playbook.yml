---
- name: Verify Apache and dump welcome variable on RHEL 7
  hosts: foreman_rhel_web_servers
  become: yes
  vars:
    # Default value if GitHub group_vars doesn't provide one
    welcome_msg: "Default playbook welcome message"

  tasks:
    - name: Verify Apache (httpd) is installed
      ansible.builtin.yum:
        name: httpd
        state: present

    - name: Dump the welcome_msg variable to the AAP job log
      ansible.builtin.debug:
        msg: "The variable pulled from GitHub is: {{ welcome_msg }}"

    - name: Ensure Apache is running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: yes

    - name: Dump the welcome_msg variable into index.html
      ansible.builtin.copy:
        content: "<html><body><h1>{{ welcome_msg }}</h1></body></html>"
        dest: /var/www/html/index.html
        mode: '0644'